<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uravu – உறவு</title>
<meta name="description" content="Family and friends, in Tamil and English">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uravu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --soft:#F1F3F6; --line:#E3E6EB; --ink:#1F2328; --muted:#5F6670;
  --primary:#1F5BD1; --primary-ink:#FFFFFF; --primary-soft:#E4ECFC;
  --tamil:#A15F00; --alert:#C5283D; --alert-soft:#FCE8EA;
  --sans:"Hind Madurai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif-ta:"Noto Serif Tamil","Hind Madurai","Tamil Sangam MN","Latha",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --soft:#1E2228; --line:#2C313A; --ink:#E8EAED; --muted:#9AA0A6;
    --primary:#8AB4F8; --primary-ink:#0E1A33; --primary-soft:#1F2D4A;
    --tamil:#F0B44C; --alert:#F28B95; --alert-soft:#3A1F24; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .av{color:color-mix(in srgb,var(--h) 45%,#fff)}
}
:root[data-theme="dark"]{
  --bg:#121418; --soft:#1E2228; --line:#2C313A; --ink:#E8EAED; --muted:#9AA0A6;
  --primary:#8AB4F8; --primary-ink:#0E1A33; --primary-soft:#1F2D4A;
  --tamil:#F0B44C; --alert:#F28B95; --alert-soft:#3A1F24; color-scheme:dark;
}
:root[data-theme="dark"] .av{color:color-mix(in srgb,var(--h) 45%,#fff)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body.has-save{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;padding:0 16px}
.ta{font-family:var(--serif-ta)}
.muted{color:var(--muted)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* avatars */
.av{--h:#1A56C4;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.25rem;
  overflow:hidden;background:color-mix(in srgb,var(--h) 15%,var(--bg));color:var(--h)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:.8rem;border:2px solid var(--bg)}
.av.xl{width:100px;height:100px;font-size:2.5rem}
.av.more,.av.add{background:var(--soft);color:var(--muted)}
.av.add{border:1.5px dashed var(--line);background:transparent}

/* home top */
.homebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px 8px;margin:0 -16px}
.pill{flex:1;display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:999px;height:52px;padding:0 18px;color:var(--muted)}
.pill:focus-within{outline:2px solid var(--primary)}
.pill input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:100%}
.pill input:focus{outline:none}
.me-btn .av{width:44px;height:44px;font-size:1.05rem}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 4px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.85rem;line-height:1.25;text-align:center}
.qa .ic{width:58px;height:58px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.qa .ic svg{width:26px;height:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 0 14px}
.sh h2{margin:0;font-size:1.12rem;font-weight:700}
.sh h2 .sub{font-weight:500;font-size:.88rem;color:var(--muted);margin-left:6px}
.sh button{color:var(--primary);font-weight:600;font-size:.92rem;flex:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.ppl{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.ppl .av{width:58px;height:58px}
.ppl .nm{font-size:.9rem;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl .tm{font-family:var(--serif-ta);font-size:.8rem;color:var(--tamil);line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl .tm.en{font-family:var(--sans);color:var(--muted)}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity}
.hs::-webkit-scrollbar{display:none}
.up{flex:none;width:156px;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.up .avs{display:flex;margin-bottom:6px}
.up .avs .av{width:40px;height:40px;font-size:1rem}
.up .avs .av+.av{margin-left:-12px;border:2px solid var(--bg)}
.up .when{font-weight:700;font-size:.85rem;color:var(--primary)}
.up.soon{border-color:color-mix(in srgb,var(--alert) 35%,var(--line));background:var(--alert-soft)}
.up.soon .when{color:var(--alert)}
.up .nm{font-weight:600;line-height:1.25}
.up .what{font-size:.86rem;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);background:var(--soft);border-radius:16px;padding:16px;margin:0}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin:36px 0 0}

/* sub page bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:4px;height:60px;margin:0 -8px}
.bar h1{flex:1;margin:0;font-size:1.2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn:hover,.txt-btn:hover{background:var(--soft)}
.txt-btn{height:40px;padding:0 16px;border-radius:999px;color:var(--primary);font-weight:700}

/* rows */
.rows{display:flex;flex-direction:column}
.r{width:100%;display:flex;align-items:center;gap:14px;padding:10px 8px;margin:0 -8px;width:calc(100% + 16px);text-align:left;border-radius:16px}
.r:hover{background:var(--soft)}
.r .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.r .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .t2{font-size:.9rem;color:var(--muted);line-height:1.35}
.r .t2 .ta{color:var(--tamil)}
.r .hit mark{background:color-mix(in srgb,var(--tamil) 22%,transparent);color:var(--ink);border-radius:3px;padding:0 2px}
.r .when{flex:none;font-size:.85rem;font-weight:600;color:var(--muted)}
.r.soon .when{color:var(--alert)}
.badge{flex:none;font-size:.78rem;font-weight:700;color:var(--alert);background:var(--alert-soft);border-radius:999px;padding:3px 10px}
.cal{flex:none;width:52px;height:52px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal b{font-size:1.25rem}
.cal small{font-size:.72rem;color:var(--muted)}
.r.soon .cal{background:var(--alert-soft)}
.r.soon .cal b{color:var(--alert)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chip{flex:none;border:1.5px solid var(--line);border-radius:999px;padding:7px 15px;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}

/* person page */
.ph{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 0}
.ph h2{margin:12px 0 0;font-size:1.6rem;line-height:1.2}
.ph .alt{color:var(--muted)}
.call{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:14px}
.call .lbl{font-size:.85rem;color:var(--muted)}
.call .ta-big{font-family:var(--serif-ta);font-size:2.4rem;font-weight:700;color:var(--tamil);line-height:1.35}
.call .en-big{font-size:2rem;font-weight:700;color:var(--tamil);line-height:1.3}
.call .en{font-weight:600}
.call .desc{font-size:.9rem;color:var(--muted)}
.acts{display:flex;justify-content:center;gap:8px;margin:22px 0 4px;flex-wrap:wrap}
.acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;width:72px;line-height:1.2;text-align:center;color:var(--ink);text-decoration:none}
.acts .ic{width:52px;height:52px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.card{border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:1rem}
.card .rows{margin:0 -4px}
.lk{display:flex;flex-wrap:wrap;gap:8px}
.lk span{background:var(--soft);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;line-height:1.3}
.lk small{font-size:.78rem;color:var(--muted)}
.lk b{font-weight:600}
.card .hs{margin:0 -16px;padding:0 16px}
.card .hs .ppl{width:76px;flex:none}
.ppl .rw{font-size:.78rem;color:var(--muted);line-height:1.2}
.prose{margin:0;white-space:pre-wrap}
.link-btn{color:var(--primary);font-weight:600;margin-top:6px}
.danger-txt{display:block;margin:26px auto 0;color:var(--alert);font-weight:600;padding:10px 18px;border-radius:999px}
.danger-txt.armed{background:var(--alert);color:#fff}

/* family */
.pov-note{margin:0 0 6px;padding:12px 14px;border-radius:16px;background:var(--primary-soft);font-size:.92rem}
.gen h2{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px;font-size:1rem}
.gen h2 .ta{font-weight:500;color:var(--muted);font-size:.86rem}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:14px 6px 12px;border:1.5px solid var(--line);border-radius:20px;min-width:0}
.fam:hover{border-color:var(--muted)}
.fam .av{margin-bottom:6px}
.fam .t{font-family:var(--serif-ta);font-weight:700;color:var(--tamil);font-size:1.08rem;line-height:1.35}
.fam .t.en{font-family:var(--sans)}
.fam .n{font-weight:600;font-size:.92rem}
.fam .s{font-size:.76rem;color:var(--muted);line-height:1.3}
.fam.ego{border-color:var(--primary);background:var(--primary-soft)}
.fam.ego .av{box-shadow:0 0 0 3px var(--primary)}
.fam.ego .t{color:var(--primary)}
.hint-line{color:var(--muted);font-size:.9rem;margin:0 0 4px}

/* forms */
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px}
.photo-pick label{position:relative;cursor:pointer}
.photo-pick .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;border:3px solid var(--bg)}
.photo-pick .cam svg{width:18px;height:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-weight:600;font-size:.92rem}
.fld .hint{font-weight:400;color:var(--muted);font-size:.84rem}
.fld input:not([type=checkbox]),.fld select,.fld textarea{font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary);background:var(--bg)}
.fld textarea{min-height:84px;resize:vertical}
.fld.big input{font-size:1.25rem;font-weight:600;padding:14px 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fld{margin-top:18px}
.who{margin-top:22px}
.who h3{margin:0;font-size:1.05rem}
.relto{display:flex;align-items:center;gap:8px;margin:8px 0 12px;font-size:.92rem;color:var(--muted)}
.relto select{font:inherit;font-size:16px;color:var(--primary);font-weight:700;background:var(--primary-soft);border:0;border-radius:999px;padding:6px 14px}
.relgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:480px){.relgrid{grid-template-columns:repeat(3,1fr)}}
.rc{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;line-height:1.3;min-height:58px;justify-content:center;transition:transform .08s,background .12s,border-color .12s}
.rc:active{transform:scale(.97)}
.rc[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:.8rem;font-weight:800;display:grid;place-items:center}
.rc[aria-pressed="true"] b{color:var(--primary)}
.rc.done{border-style:dashed;background:var(--soft);cursor:default}
.rc.done b{color:var(--muted)}
.rc.done .of{color:var(--ok, #1E7B3C);font-weight:600}
@media (prefers-reduced-motion: reduce){.rc{transition:none}.rc:active{transform:none}}
.rc b{font-weight:600;font-size:.94rem}
.rc .ta{color:var(--tamil);font-size:.9rem}
.rc .of{color:var(--muted);font-size:.8rem}
.rc[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);border-width:2px}
.subh{margin:16px 0 8px;font-size:.88rem;color:var(--muted);font-weight:600}
.cur-link{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:0 0 0 14px;margin-top:6px;font-size:.92rem}
.cur-link button,.like-row button{width:44px;height:44px;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.like-row{display:grid;grid-template-columns:1fr 1.4fr 44px;gap:6px;margin-bottom:6px}
.like-row input,.like-row select{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0}
.like-row input:focus,.like-row select:focus{outline:none;border-color:var(--primary);background:var(--bg)}
details.more{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;color:var(--primary);font-weight:700;list-style:none;padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:-4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;font-weight:600;font-size:.95rem}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(22px)}
@media (prefers-reduced-motion: reduce){.switch input,.switch input::after{transition:none}}
.deadf:not(:has(input[name="dead"][value="1"])) .dodfld{display:none}
.pick{max-height:300px;overflow:auto;border-radius:16px;background:var(--soft);padding:4px}
.pk{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;font-weight:500;cursor:pointer}
.pk:hover{background:var(--bg)}
.pk input{width:20px;height:20px;accent-color:var(--primary);flex:none}
.pk .av{width:34px;height:34px;font-size:.9rem;border:0}
.pkgo{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pkgo:hover{background:var(--line);color:var(--primary)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:999px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--bg);font-weight:700;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prof{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:20px;margin-top:6px}
.prof .av{width:56px;height:56px}
.prof .tx{flex:1;display:flex;flex-direction:column}
.prof .tx span{color:var(--primary);font-weight:600;font-size:.9rem}
.plain-btn{width:100%;height:50px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;margin-top:10px}
.plain-btn.danger{color:var(--alert)}
.plain-btn.armed{background:var(--alert);color:#fff;border-color:var(--alert)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:640px;margin:0 auto}
.btn-p{width:100%;height:54px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1.05rem}
.err{color:var(--alert);font-weight:600;margin:0 0 8px;text-align:center}
.slots{position:relative;display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.slot{display:flex;align-items:center;gap:14px;padding:12px 64px 12px 12px;border:1.5px solid var(--line);border-radius:20px;text-align:left;width:100%}
.slot:hover{border-color:var(--muted)}
.slot .tx{display:flex;flex-direction:column;min-width:0}
.slot small{color:var(--muted);font-size:.8rem}
.slot b{font-size:1.05rem}
.swap{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--bg);border:1.5px solid var(--line);color:var(--primary)}
.path{list-style:none;margin:0;padding:0}
.pnode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:4px 0}
.pnode .av{width:44px;height:44px;font-size:1.05rem}
.pnode b{font-weight:600}
.plink{margin-left:21px;border-left:2.5px solid var(--primary);padding:8px 0 8px 31px;color:var(--muted);font-size:.92rem}
.plink b{color:var(--ink);font-weight:600}
.callrow{display:flex;align-items:center;gap:12px;padding:8px 0}
.callrow+.callrow{border-top:1px solid var(--line)}
.callrow .tx{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.callrow small{color:var(--muted);font-size:.85rem}
.callrow .big{font-family:var(--serif-ta);font-weight:700;font-size:1.3rem;color:var(--tamil)}
.callrow .big.en{font-family:var(--sans)}
.tree-scroll{overflow:auto;margin:0 -16px;padding:4px 0 8px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;cursor:grab}
.tree-scroll.dragging{cursor:grabbing;user-select:none}
.tree-scroll.dragging .tnode{pointer-events:none}
.tree{position:relative;margin:0 auto}
.tree svg{position:absolute;inset:0;pointer-events:none}
.tree .tl{fill:none;stroke:var(--muted);stroke-width:1.6;opacity:.55}
.tree .tl.dash{stroke-dasharray:4 4}
.tree .tl.fam{opacity:1;stroke-width:2;stroke-linecap:round}
.tband{position:absolute;left:0;right:0;border-radius:20px;background:color-mix(in srgb,var(--soft) 70%,transparent)}

/* ---------- app shell: bottom tabs, ＋ button, sheets, transitions ---------- */
:root{--badge:#E5283E;--badge-ink:#FFFFFF;--shadow:0 6px 20px rgba(16,24,40,.18)}
body.has-tabs{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar[hidden]{display:none}
.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px;padding:8px 2px 9px;font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.15;-webkit-tap-highlight-color:transparent}
.tab .pip{width:62px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab svg.i{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pip{background:var(--primary-soft);color:var(--primary)}
.tab[aria-current="page"] svg.i{stroke-width:2.3}
.dot{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--badge);color:var(--badge-ink);font-size:.72rem;font-weight:800;line-height:1;display:grid;place-items:center;border:2px solid var(--bg);font-family:var(--sans)}
.tab .dot{top:2px;right:calc(50% - 30px)}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s}
.fab svg.i{width:30px;height:30px;stroke-width:2.4;transition:transform .2s}
.fab[aria-expanded="true"] svg.i{transform:rotate(45deg)}
.fab:active{transform:scale(.94)}
.fab[hidden]{display:none}
.bar.top{height:64px;margin:0}
.bar.top h1{font-size:1.45rem}
.qa .ic{position:relative}
.qa .ic .dot{top:-4px;right:-4px}
.qa .ic.soft{background:var(--primary-soft);color:var(--primary)}
.r,.ppl,.tnode,.fam,.up{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.r .badge.hot,.badge.hot{background:var(--badge);color:var(--badge-ink)}

/* bottom sheets */
#sheet[hidden]{display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.45);animation:fadeIn .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:26px 26px 0 0;padding:0 16px;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet:focus{outline:none}
.sheet::after{content:"";display:block;height:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet:has(.savebar)::after{display:none}
.sheet-drag{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0 2px;margin:0 -16px;touch-action:none;cursor:grab}
.grab{display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet .bar{position:sticky;top:15px;height:56px;margin:0 -8px 0 0;touch-action:none}

.sheet .savebar{position:sticky;bottom:0;left:auto;right:auto;margin:22px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet .pick{max-height:240px}
#sheet.closing .scrim{animation:fadeOut .18s ease-in forwards}
#sheet.closing .sheet{animation:sheetDown .18s ease-in forwards}
body.sheet-open{overflow:hidden}

.qhead small{color:var(--muted);font-size:.9rem}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-bottom:4px}
.qi{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0;border-radius:16px;font-size:.82rem;font-weight:600;color:var(--ink);text-decoration:none;text-align:center;line-height:1.2}
.qi .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.qi.wa .ic{background:color-mix(in srgb,#25D366 18%,var(--bg));color:#128C4B}
.qi.tel .ic{background:color-mix(in srgb,#1E7B3C 15%,var(--bg));color:#1E7B3C}
.qi[aria-disabled="true"]{opacity:.45}
.qi:active .ic{transform:scale(.92)}
.install{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:var(--primary-soft);color:var(--ink);margin-top:14px}
.install .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center}
.install span{display:flex;flex-direction:column;line-height:1.3}
.install small{color:var(--muted)}

/* page slides */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{to{transform:translateY(100%)}}
@keyframes inR{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-20%);opacity:0}to{transform:none;opacity:1}}
.app.go-fwd{animation:inR .26s cubic-bezier(.2,.8,.2,1)}
.app.go-back{animation:inL .24s cubic-bezier(.2,.8,.2,1)}
.app.go-tab{animation:fadeIn .18s ease-out}
.app.go-fwd .savebar,.app.go-back .savebar{animation:fadeIn .15s .24s both}
@media (prefers-reduced-motion: reduce){
  .app.go-fwd,.app.go-back,.app.go-tab,.sheet,.scrim,#sheet.closing .sheet,#sheet.closing .scrim,.app .savebar{animation:none!important}
  .fab,.fab svg.i,.tab .pip{transition:none}
}
:root[data-theme="dark"]{--shadow:0 6px 20px rgba(0,0,0,.5)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--shadow:0 6px 20px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .qi.wa .ic{color:#5BE08F}
  :root:not([data-theme="light"]) .qi.tel .ic{color:#7DD99A}
}
:root[data-theme="dark"] .qi.wa .ic{color:#5BE08F}
:root[data-theme="dark"] .qi.tel .ic{color:#7DD99A}

const pickValue = ([ta, tl]) => `${tl} (${ta})`;
function pickFind(cat, val) {
  const list = pickList(cat); if (!list || !val) return null;
  const v = val.trim().toLowerCase();
  return list.find(o => pickValue(o).toLowerCase() === v || o[1].toLowerCase() === v || o[0] === val.trim() || v.startsWith(o[1].toLowerCase() + ' ')) || null;

function pickMatches(cat, q) {
  const list = pickList(cat), v = q.trim().toLowerCase();
  if (!v || pickFind(cat, q)) return list;
  return list.filter(([ta, tl, en]) => ta.includes(q.trim()) || tl.toLowerCase().includes(v) || (en || '').toLowerCase().includes(v));

function resolvePick(inp) {
  if (!inp || !inp.dataset || !inp.dataset.pick || !inp.value.trim()) return true;
  const hit = pickFind(inp.dataset.pick, inp.value); if (hit) { inp.value = pickValue(hit); return true; }
  const m = pickMatches(inp.dataset.pick, inp.value);
  if (m.length === 1) { inp.value = pickValue(m[0]); return true; }
  return m.length === 0;
}

function pgFamily() {

    `<div class="chips"><button class="chip" data-act="famview" data-id="tree" aria-pressed="${S.settings.famView !== 'cards'}">Tree</button><button class="chip" data-act="famview" data-id="cards" aria-pressed="${S.settings.famView === 'cards'}">By generation</button></div>` + scopeChips +
    (S.settings.famView === 'cards' ? order.map(g => {

function readPhoto(file) {

    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'), s = 240, m = Math.min(img.width, img.height);
      cv.width = cv.height = s;
      cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      pendingPhoto = cv.toDataURL('image/jpeg', 0.82);
      $('#photoPrev').innerHTML = `<span class="av xl"><img src="${pendingPhoto}" alt=""></span>`;

}

/* People who can reach you now but couldn’t if this person were deleted */
function reachMe(skip) { const seen = new Set([S.me]), q = [S.me]; while (q.length) { const x = q.shift(); for (const [y] of socialNeighbors(x)) if (y !== skip && !seen.has(y)) { seen.add(y); q.push(y); } } return seen; }

const possess = id => id === S.me ? 'your' : S.people[id].name + '’s';

/* Friends, colleagues and people I met are joined to me by a "social" link, so a friend's
   family can be reached too: You -> Arjun (friend) -> Gowmathi (Arjun's wife). */
const SOCIAL = { friend:['நண்பர்','Nanbar','friend'], colleague:['சக ஊழியர்','Saga Oozhiyar','colleague'], acquaintance:['அறிமுகமானவர்','Arimugamanavar','acquaintance'] };
const socialWord = (kind, id) => kind === 'friend' && S.people[id].gender === 'f' ? ['தோழி','Thozhi','friend'] : SOCIAL[kind];
function socialNeighbors(x) {
  const out = allLinks(x);
  const isRoot = id => knownDirectly(id);
  if (x === S.me) { for (const id in S.people) if (isRoot(id)) out.push([id, S.people[id].circle]); }
  else if (isRoot(x)) out.push([S.me, S.people[x].circle]);
  return out;
}
function socialPath(a, b) {
  const prev = { [a]: null }, q = [a];
  outer: while (q.length) {
    const x = q.shift();
    for (const [y, k] of socialNeighbors(x)) { if (y in prev) continue; prev[y] = [x, k]; if (y === b) break outer; q.push(y); }
  }
  if (!(b in prev)) return null;
  const nodes = [b], kinds = []; let c = b;
  while (prev[c]) { const [p, k] = prev[c]; kinds.unshift(k); nodes.unshift(p); c = p; }
  return { nodes, kinds };
}
// What nodes[0] calls the last node. Across a social link, name them through the person
// on the far side of it, e.g. "Arjun மனைவி" (Arjun's wife) or "Arjun நண்பர்" (Arjun's friend).
function connTerm(nodes, kinds) {
  const src = nodes[0], tgt = nodes[nodes.length - 1];
  let li = -1; kinds.forEach((k, i) => { if (SOCIAL[k]) li = i; });
  const saved = EGO;
  try {
    if (li < 0) { EGO = src; return kinOf(tgt); }
    const piv = nodes[li + 1];
    if (piv === tgt) {
      const prev = nodes[li], w = socialWord(kinds[li], tgt);
      if (prev === src) return { ta:w[0], tl:w[1], en:cap(w[2]) };
      const pv = S.people[prev];
      return { ta:`${pv.tamilName || pv.name} ${w[0]}`, tl:w[1], en:`${pv.name}’s ${w[2]}` };
    }
    EGO = piv;
    const r = kinOf(tgt), pv = S.people[piv];
    return { ta:`${pv.tamilName || pv.name} ${r.ta}`, tl:r.tl, en:`${pv.name}’s ${r.en.toLowerCase()}` };
  } finally { EGO = saved; }
}
function pgConnect(c) {
  const a = c.a && S.people[c.a] ? c.a : S.me, b = c.b && S.people[c.b] ? c.b : '';
  const slot = (key, id, label) => `<button class="slot" data-act="pick-person" data-id="${key}">${id ? avatar(S.people[id]) : `<span class="av add">${ICON.plus}</span>`}<span class="tx"><small>${label}</small><b>${id ? esc(id === S.me ? 'You (' + S.people[id].name + ')' : S.people[id].name) : 'Choose a person'}</b></span></button>`;

  else if (a === b) body = `<p class="empty">That’s the same person. Choose someone else.</p>`;
  else {
    let path, ab, ba;
    path = socialPath(a, b);
    if (path) { ab = connTerm(path.nodes, path.kinds); ba = connTerm([...path.nodes].reverse(), [...path.kinds].reverse()); }
    if (!path) body = `<p class="empty">${esc(S.people[a].name)} and ${esc(S.people[b].name)} aren’t linked yet. Open either person and add a relationship to connect them.</p>`;
    else {

}

function funcMissed(f) {

    if (!married && nb.some(([o, t]) => t === 'parent' && host(o))) continue;
    const pars = nb.filter(([, t]) => t === 'parent').map(([o]) => o);
    const sibs = [...nb.filter(([, t]) => t === 'sibling').map(([o]) => o), ...S.edges.filter(e => e.type === 'parent' && pars.includes(e.parent) && e.child !== id).map(e => e.child)];
    const k = kinOf(id), sib = sibs.find(o => on.has(o)), kid = nb.find(([o, t]) => t === 'child' && on.has(o));
    let why = '', rank = 9;
    if (k.family && (k.tk || []).length <= 2) { why = 'Close family'; rank = 0; }
    else if (sib) { why = `${nm(sib)} is invited, ${p.gender === 'f' ? 'her' : 'his'} ${p.gender === 'f' ? 'sister' : 'brother'} ${p.name} is not`; rank = 1; }

const SECRET_KEYS = ['number', 'policyNo', 'mobile'];
const dt = d => DOC_TYPES[d.type] || DOC_TYPES.other;

const mask = v => { v = String(v || ''); return v.length > 4 ? '•••• ' + v.slice(-4) : v; };

function daysUntil(on) { const [y, m, d] = on.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - today()) / 864e5); }
function addYears(on, n) { if (!on) return ''; const [y, m, d] = on.split('-').map(Number); const x = new Date(y + n, m - 1, d); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; }
function addDays(on, n) { if (!on) return ''; const [y, m, d] = on.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`; }

function dueList(d) {

  const lead = remindOf(d), on = lead && daysUntil(addDays(x.date, -lead)) > 0 ? addDays(x.date, -lead) : x.date;
  const a = on.replace(/-/g, ''), b = addDays(on, 1).replace(/-/g, '');

/* photos of documents live in IndexedDB on this device (too big for normal storage) */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('uravu', 1); r.onupgradeneeded = () => r.result.createObjectStore('photos'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  }));
  const run = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('photos', mode), r = fn(t.objectStore('photos')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    put: (k, v) => run('readwrite', st => st.put(v, k)),
    get: k => run('readonly', st => st.get(k)),
    del: k => run('readwrite', st => st.delete(k)),
    all: async () => { const db = await open(); return new Promise((res, rej) => { const out = {}, t = db.transaction('photos'), c = t.objectStore('photos').openCursor(); c.onsuccess = () => { const k = c.result; if (k) { out[k.key] = k.value; k.continue(); } }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); },
  };
})();
function hydratePhotos() { document.querySelectorAll('img[data-photo]:not([src])').forEach(img => { IDB.get(img.dataset.photo).then(v => { if (v) img.src = v; else img.alt = 'Photo not on this device'; }).catch(() => { img.alt = 'Photo not available'; }); }); }
function readDocPhoto(file) {
  if (!file) return;
  const docId = cur().id, isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if (isPdf && file.size > 15 * 1024 * 1024) { toast('That PDF is over 15 MB. Try a smaller copy.'); return; }
  const r = new FileReader();
  const keep = async (data, meta) => {
    const pid = uid();
    try {
      await IDB.put(pid, data);
      const d = S.docs.find(x => x.id === docId); d.photos = [...(d.photos || []), pid];
      d.fileMeta = Object.assign({}, d.fileMeta, { [pid]: meta });
      save(); if (cur().id === docId) rerender(); toast(meta.kind === 'pdf' ? 'PDF saved on this device' : 'Photo saved on this device');
    } catch (e) { toast('Files can’t be saved in this browser.'); }
  };
  r.onload = () => {
    if (isPdf) { keep(r.result, { kind: 'pdf', name: file.name || 'document.pdf', size: file.size }); return; }
    const img = new Image();
    img.onload = () => {
      const max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      keep(cv.toDataURL('image/jpeg', 0.78), { kind: 'image', name: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' });
    };
    img.onerror = () => toast('That file couldn’t be opened. Use a photo or a PDF.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
const fileKind = (d, pid) => (d.fileMeta && d.fileMeta[pid] && d.fileMeta[pid].kind) || 'image';
const fileSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function dataUrlToBlob(u) {
  const [head, b64] = u.split(','), mime = (head.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
// A normal browser download (goes to the phone's Downloads folder)
function saveFile(filename, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function saveDocFile(pid) {

function readRestore(file) {

    if (c.p === 'event' && c.eid && !S.events.some(e => e.id === c.eid)) { ui.stack.pop(); continue; }
    if ((c.p === 'doc' || (c.p === 'docedit' && c.id)) && !(S.docs || []).some(d => d.id === c.id)) { ui.stack.pop(); continue; }
    if (c.p === 'term' && !(S.docs || []).some(d => d.id === c.doc)) { ui.stack.pop(); continue; }
    if (['func', 'funcadd'].includes(c.p) && !(S.funcs || []).some(f => f.id === c.id)) { ui.stack.pop(); continue; }
    if (c.p === 'funcedit' && c.id && !(S.funcs || []).some(f => f.id === c.id)) { ui.stack.pop(); continue; }
    if (c.p === 'quick' && !S.people[c.id]) { ui.stack.pop(); continue; }

  }
  const top = cur(), sheetTop = ui.stack.length > 1 && isSheet(top), app = $('#app');
  // Small tasks open in a bottom sheet over the page below them. The page below is drawn with the

  if (sheetTop) ui.stack.pop();
  const c = cur();
  try {
    if (!sheetTop || c !== shell.base || shell.ver !== dataVer) {
      const sameBase = c === shell.base, y = window.scrollY;
      if (c.p === 'edit') { pendingPhoto = null; pendingLinks = []; pendingRemove = new Set(); pendingClicked = new Set(); }
      if (c.p === 'family') {
        EGO = c.pov && S.people[c.pov] ? c.pov : null; try { app.innerHTML = pgFamily(c); } finally { EGO = null; }
        const eg = app.querySelector('.tnode.ego'), sc = app.querySelector('.tree-scroll');
        if (eg && sc) { const z = c.zoom || 1; sc.scrollLeft = eg.offsetLeft * z - sc.clientWidth / 2 + TW * z / 2; if (c.full) sc.scrollTop = eg.offsetTop * z - sc.clientHeight / 2; }
      }

      else if (sameBase) window.scrollTo(0, y);

  'qd-cancel': () => { delete cur().qd; rerender(); },
  'qd-save': () => qdSave(),
  'ask-go': () => askAI($('#askIn').value),
  'ask-sugg': id => askAI(id),
  'ask-stop': () => aiCtl?.abort(),
  'ask-q': () => { const q = ui.q.trim(); push('ask', {}); askAI(q); },
  backup: () => doBackup(),
  'restore-no': () => { delete cur().restore; rerender(); },
  'restore-yes': () => {
    const ph = cur().restore.photos || {}; Object.entries(ph).forEach(([k, v]) => IDB.put(k, v).catch(() => {}));
    S = cur().restore.data; normalize(); save();
    ui = { stack: [{ p: 'home' }], q: '' }; render(); window.scrollTo(0, 0); toast(`Restored ${Object.keys(S.people).length} people`);
  },
  'qrel-open': () => { const id = cur().id; cur().qrel = { to: id === S.me ? Object.keys(S.people).find(x => x !== S.me) : S.me }; rerender(); $('#qrelTo')?.focus(); },
  'qrel-close': () => { delete cur().qrel; rerender(); },
  'qrel-pick': id => qrelPick(id),
  'rel-rm': (eid, a) => {
    const grp = linkGroup(eid), n = grp.length;
    arm(a, n > 1 ? `Remove ${n} links` : 'Remove', () => { removeLinks(grp); save(); rerender(); toast(n > 1 ? `Removed, plus ${n - 1} link${n > 2 ? 's' : ''} added with it` : 'Link removed'); });
  },
  'qlike-open': id => qlikeOpen(id, '', -1),
  'qlike-edit': id => { const l = S.people[cur().id].likes[Number(id)]; if (l) qlikeOpen(l.cat, l.val, Number(id)); },
  'qlike-cancel': () => { $('#qlike').innerHTML = ''; $('#qlikeChips').hidden = false; },
  'qlike-save': () => qlikeSave(),
  'qlike-del': id => { S.people[cur().id].likes.splice(Number(id), 1); save(); qlikeRefresh('Removed'); },
  'set-dead': (id, a) => {
    const p = S.people[id]; p.dead = a.dataset.v === '1'; if (!p.dead) p.dod = '';
    const n = p.dead ? dropFromGuests(id) : 0; save();
    a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === a)));
    if (n) toast(`${p.name} removed from ${n} upcoming guest list${n === 1 ? '' : 's'}.`);
  },
  'set-gender': (id, a) => {
    const gp = genderProblem(id, a.dataset.g); if (gp) { toast(gp); return; }
    S.people[id].gender = a.dataset.g; save();
    a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === a)));
  },
  'bulk-male': (id, a) => arm(a, 'Tap again to confirm', () => {
    // husband/wife pairs: the partner becomes the opposite gender
    for (const p of noGender()) if (!p.gender) { p.gender = 'm'; inferGenders(); }
    save(); render(); toast('Done. Change anyone who should be Female.');
  }),
  famview: id => { S.settings.famView = id; save(); render(); },
  'connect-to': id => push('connect', { a: S.me, b: id }),
  'pick-person': key => push('pickp', { key }),
  'pick-done': id => { const prev = ui.stack[ui.stack.length - 2]; prev[cur().key] = id; back(); },
  swap: () => { const c = cur(), a = c.a || S.me; c.a = c.b || S.me; c.b = a; render(); },
  go: (id, a) => push(id, a.dataset.f ? { f: a.dataset.f } : {}),
  person: id => push('person', { id }),
  edit: id => push('edit', { id }),
  new: (id, a) => push('edit', { id: '', relTo: id || '', circle: a.dataset.circle || '' }),
  'event-new': id => push('event', { eid: '', preset: id || '' }),
  'event-edit': id => push('event', { eid: id }),
  'see-family': id => push('family', { pov: id === S.me ? null : id }),
  pov: id => { cur().pov = id === S.me ? null : id; render(); window.scrollTo(0, 0); },
  filter: id => { cur().f = id; render(); },
  tab: id => { cur().tab = id; render(); },
  'pick-rel': id => {
    const to = $('#relTo').value, i = pendingLinks.findIndex(l => l.rel === id && l.to === to);
    if (i >= 0) { pendingLinks.splice(i, 1); renderPending(); return; }   // tap again = undo
    pendingLinks.push({ rel: id, to });
    const g = { father:'m', mother:'f', husband:'m', wife:'f', ebrother:'m', ybrother:'m', esister:'f', ysister:'f', son:'m', daughter:'f' }[id];
    const gb = document.querySelector(`[data-act="pick-gender"][data-id="${g}"]`); if (gb) H['pick-gender'](g, gb);
    renderPending();
  },
  'rel-already': () => toast('Already linked. Remove it under “Linked now” if it’s wrong.'),
  'pending-rm': id => { pendingLinks.splice(Number(id), 1); renderPending(); },
  'pick-dead': (id, a) => { $('#pf [name="dead"]').setAttribute('value', id || ''); a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === a))); },
  'pick-gender': (id, a) => { $('#pf [name="gender"]').value = id; a.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === a))); },
  'pick-circle': (id, a) => {
    const to = $('#relTo').value;
    if (to !== S.me && SOCIAL[id]) { const i = pendingLinks.findIndex(l => l.social === id && l.to === to); if (i >= 0) pendingLinks.splice(i, 1); else pendingLinks.push({ social: id, to }); renderPending(); return; }
    // How you know them: pick as many as apply (e.g. Colleague and Friend)
    const set = new Set(($('#f-circle').value || '').split(',').filter(Boolean));
    if (set.has(id)) set.delete(id); else set.add(id);
    $('#f-circle').value = [...set].join(','); a.setAttribute('aria-pressed', String(set.has(id)));
  },
  pick: (id, a) => { $('#f-' + a.dataset.group).value = id; a.parentElement.querySelectorAll('[data-act="pick"]').forEach(b => b.setAttribute('aria-pressed', String(b === a))); },
  'like-add': id => { const box = $('#likesEdit'); box.insertAdjacentHTML('beforeend', likeRow({ cat: id, val: '' })); box.lastElementChild.querySelector(id ? '.lv' : '.lc').focus(); },
  'like-rm': (id, a) => a.closest('.like-row').remove(),
  'photo-rm': (id, a) => { pendingPhoto = ''; $('#photoPrev').innerHTML = avatar(blankPerson('new', { name: $('[name="name"]').value }), 'xl'); a.remove(); },
  'rm-link': eid => {
    pendingClicked.add(eid); const grp = linkGroup(eid); grp.forEach(x => pendingRemove.add(x.id)); markRemoving();
    toast(grp.length > 1 ? `${grp.length} links will be removed when you save` : 'Will be removed when you save');
  },
  'rm-undo': eid => {
    for (const c of [...pendingClicked]) if (linkGroup(c).some(x => x.id === eid)) pendingClicked.delete(c);
    pendingRemove = new Set([...pendingClicked].flatMap(c => linkGroup(c).map(x => x.id))); markRemoving();
  },
  'save-person': () => savePerson(),
  'del-person': (id, a) => arm(a, (() => { const n = unlinkedIfDeleted(id).length; return n ? `Tap again. ${n} ${n === 1 ? 'person' : 'people'} will lose their link` : 'Tap again to delete'; })(), () => {
    const before = reachMe(null), dname = S.people[id].name;
    const viaOnly = S.edges.filter(e => e.type === 'social' && e.a === id).map(e => e.b);
    S.edges = S.edges.filter(e => ![e.child, e.parent, e.a, e.b].includes(id));
    S.blocked = (S.blocked || []).filter(k => !k.split('|').includes(id));
    for (const o of viaOnly) { const q = S.people[o]; if (q && !allLinks(o).length) { q.circle = 'acquaintance'; if (!q.metHow) q.metHow = `Met through ${dname}`; } }
    const nowReach = reachMe(null), lost = [...before].filter(x => x !== id && S.people[x] && !nowReach.has(x));
    if (lost.length) setTimeout(() => toast(`${lost.length} ${lost.length === 1 ? 'person is' : 'people are'} no longer linked. Find them under People.`), 2300);
    S.events.forEach(e => { e.people = e.people.filter(x => x !== id); });
    S.events = S.events.filter(e => e.people.length);
    (S.funcs || []).forEach(f => f.guests.forEach(g => { if (g.pid === id) { g.name = S.people[id].name; g.pid = ''; } }));
    const gone = (S.docs || []).filter(d => d.owner === id); gone.forEach(d => (d.photos || []).forEach(p => IDB.del(p).catch(() => {}))); S.docs = (S.docs || []).filter(d => d.owner !== id);
    const n = S.people[id].name; delete S.people[id]; save(); render(); window.scrollTo(0, cur().y || 0); toast(`Deleted ${n}`);
  }),
  'save-event': () => saveEvent(),
  'del-event': (id, a) => arm(a, 'Tap again to delete', () => { S.events = S.events.filter(e => e.id !== id); save(); render(); toast('Date deleted'); }),
  lang: id => { S.settings.lang = id; save(); render(); },
  'my-gender': id => { S.people[S.me].gender = id; save(); render(); toast('Saved'); },
  'reset-demo': (id, a) => arm(a, 'Tap again to replace everything', () => { S = demo(); save(); ui = { stack: [{ p: 'home' }], q: '' }; render(); toast('Sample family loaded'); }),
  'clear-all': (id, a) => arm(a, 'Tap again to clear everything', () => {
    const me = S.people[S.me];
    S = { me:'me', people:{ me: blankPerson('me', { name: me.name, tamilName: me.tamilName, gender: me.gender, photo: me.photo }) }, edges:[], events:[], settings:S.settings };
    save(); ui = { stack: [{ p: 'home' }], q: '' }; render(); toast('Cleared. Start adding people.');
  }),
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = H[a.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(a.dataset.id, a, e);
});
document.addEventListener('input', e => {
  if (e.target.classList && e.target.classList.contains('ppick-q')) ppickList(e.target.closest('.ppick-dd'));
  if (e.target.id === 'tfindIn') treeFindList();
  if (e.target.id === 'gq') { const v = e.target.value.trim().toLowerCase(); cur().q = e.target.value; let n = 0; document.querySelectorAll('.glist .grow').forEach(l => { l.hidden = !!v && !l.dataset.name.includes(v); if (!l.hidden) n++; }); const none = document.querySelector('#gqNone'); if (none) none.hidden = n > 0 || !document.querySelector('.glist .grow'); }
  if (e.target.id === 'faq') { const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('#faList .pk').forEach(l => { l.hidden = v && !l.dataset.name.includes(v); }); document.querySelectorAll('#faList .fa-sec').forEach(s2 => { s2.hidden = !!v; }); }
  if (e.target.classList && e.target.classList.contains('lc')) swapValueField(e.target);
  if (e.target.dataset && e.target.dataset.pick) showPick(e.target);
  if (e.target.id === 'q') { ui.q = e.target.value; $('#homeBody').innerHTML = homeBody(); }
  else if (e.target.id === 'ppf') { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('[data-act="pick-done"]').forEach(l => { l.hidden = q && !l.dataset.name.includes(q); }); }
  else if (e.target.id === 'pfilter') { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll('.pk').forEach(l => { l.hidden = q && !l.dataset.name.includes(q); }); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'qrelTo') { cur().qrel.to = e.target.value; $('#qrelgrid').innerHTML = qrelChips(e.target.value); }
  if (e.target.id === 'photoIn') readPhoto(e.target.files[0]);
  if (e.target.id === 'restoreIn') readRestore(e.target.files[0]);
  if (e.target.id === 'docPhotoIn') [...e.target.files].forEach(readDocPhoto);
  if (e.target.closest && e.target.closest('#faList')) faCount();
  if (e.target.dataset && e.target.dataset.gfield) { const [, g] = funcGuest(e.target.dataset.gid); if (g) { g[e.target.dataset.gfield] = e.target.dataset.gfield === 'moi' ? e.target.value.replace(/[^\d.]/g, '') : e.target.value.trim(); save(); if (e.target.dataset.gfield === 'moi') rerender(); } }
  if (e.target.id === 'relTo') { $('#relgrid').innerHTML = relChips(e.target.value); $('#othergrid').innerHTML = otherChips(e.target.value, $('#f-circle').value); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.closest) return;
  if (e.target.closest('#qlike')) { e.preventDefault(); qlikeSave(); }
  else if (e.target.id === 'askIn' && !e.shiftKey) { e.preventDefault(); askAI(e.target.value); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.stack.length > 1 && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) back(); });

/* ---------- install as an app (PWA) ---------- */
let installEvt = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installRow() {
  if (isStandalone()) return '';
  if (installEvt) return `<button class="install" data-act="install"><span class="ic">${ICON.install}</span><span><b>Install Uravu</b><small>Opens like an app. Works offline.</small></span></button>`;
  if (isIOS()) return `<div class="install"><span class="ic">${ICON.install}</span><span><b>Install Uravu</b><small>Tap Share, then “Add to Home Screen”</small></span></div>`;
  return '';
}
async function installApp() {
  if (!installEvt) return;
  const ev = installEvt; installEvt = null; ev.prompt();
  try { await ev.userChoice; } catch (e) {}
  rerender();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (['home', 'settings'].includes(cur().p)) rerender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Uravu installed'); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
histDepth = history.state && typeof history.state.d === 'number' ? history.state.d : 0;
if (!history.state) history.replaceState({ d: 0 }, '');
load();
// app-icon shortcuts open a tab directly, e.g. ./#people
{ const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { ui.stack = [{ p: h }]; history.replaceState(history.state, '', location.pathname + location.search); } }
render();
</script>
